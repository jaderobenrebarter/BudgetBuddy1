<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4b2e9b" />
  <title>BudgetBuddy – Money made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* BudgetBuddy – violet & coral palette */
:root {
  --bg: #f5f3fb;
  --surface: #ffffff;
  --ink: #1b1633;
  --muted: #6b6585;
  --line: #e6e1f3;
  --primary: #4b2e9b;
  --primary-dark: #3a2380;
  --soft: #ece6fa;
  --accent: #ff7a59;
  --accent-soft: #ffe9e2;
  --good: #12a594;
  --c1: #4b2e9b; --c2: #ff9f1c; --c3: #12b5a6; --c4: #e0457b; --c5: #5b8def;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(27,22,51,.05), 0 8px 24px -12px rgba(75,46,155,.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

a.btn, a.link { text-decoration: none; }
.hint { font-size: 12.5px; color: var(--muted); margin: -6px 0 14px; display: flex; gap: 12px; flex-wrap: wrap; }
.hint span::before { content: '○ '; }
.hint span.ok { color: var(--good); font-weight: 600; }
.hint span.ok::before { content: '✓ '; }
.row-between { display: flex; justify-content: flex-end; margin: -8px 0 14px; }
.btn[disabled] { opacity: .7; cursor: progress; }
.control.bad { border-color: #e2552f; background: #fff7f4; }
a.link:hover { text-decoration: underline; }
/* ---------- Auth ---------- */
.auth { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }
.auth-hero { background: linear-gradient(160deg, #2a1768 0%, #4b2e9b 60%, #6a49c8 100%); color: #fff; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-hero::after { content: ""; position: absolute; right: -120px; bottom: -120px; width: 380px; height: 380px; border-radius: 50%; background: var(--accent); opacity: .9; }
.auth-hero::before { content: ""; position: absolute; right: 90px; bottom: 150px; width: 120px; height: 120px; border-radius: 50%; background: #ffd166; opacity: .95; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; color: #fff; box-shadow: 0 8px 20px -8px rgba(255,122,89,.8); }
.brand b { font-size: 22px; letter-spacing: -.02em; display: block; line-height: 1.1; }
.brand small { opacity: .75; font-size: 13px; }
.auth-hero h1 { font-size: clamp(40px, 5vw, 68px); line-height: 1; letter-spacing: -.04em; font-weight: 800; position: relative; z-index: 1; }
.auth-hero h1 span { color: #ffd166; display: block; }
.auth-hero p { margin-top: 20px; max-width: 420px; opacity: .85; font-size: 17px; position: relative; z-index: 1; }
.chips { display: flex; gap: 10px; margin-top: 28px; position: relative; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 600; font-size: 14px; }
.auth-panel { display: grid; place-items: center; padding: 40px 24px; background: var(--surface); }
.auth-card { width: 100%; max-width: 420px; }
.auth-card h2 { font-size: 34px; letter-spacing: -.03em; font-weight: 800; }
.auth-card > p { color: var(--muted); margin: 6px 0 26px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.tab { background: none; border: 0; padding: 10px 6px; margin-right: 18px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--primary); }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.control { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; height: 50px; color: var(--muted); transition: border-color .15s, background .15s; }
.control:focus-within { border-color: var(--primary); background: #fff; }
.control input, .control select { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; height: 100%; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 0 20px; height: 48px; font-weight: 700; background: var(--primary); color: #fff; transition: background .15s, transform .1s; }
.btn:hover { background: var(--primary-dark); }
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--soft); color: var(--primary); }
.btn.ghost:hover { background: #e1d8f7; }
.btn.danger { background: var(--accent-soft); color: #c2410c; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 10px; }
.note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); color: var(--primary); font-size: 13px; text-align: center; }
.error { color: #c2410c; font-size: 13px; margin: -6px 0 12px; min-height: 0; }
.link { background: none; border: 0; color: var(--primary); font-weight: 700; padding: 0; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.side .brand { padding: 0 8px 28px; }
.side .brand-mark { width: 40px; height: 40px; border-radius: 12px; }
.side .brand b { font-size: 18px; color: var(--ink); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 600; }
.nav a:hover { background: var(--bg); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--soft); color: var(--primary); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.tip { background: var(--accent-soft); border-radius: 14px; padding: 14px; font-size: 13px; color: #8a3a22; }
.tip b { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; color: #c2410c; }
.logout { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; background: none; color: var(--muted); font-weight: 600; border-radius: 12px; text-align: left; }
.logout:hover { background: var(--bg); color: var(--ink); }
.main { min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar small { color: var(--muted); display: block; }
.topbar b { font-size: 17px; }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid var(--line); border-radius: 999px; font-weight: 600; font-size: 14px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.avatar.lg { width: 64px; height: 64px; font-size: 20px; }
.page { padding: 36px 40px 60px; max-width: 1180px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.page-head h1 { font-size: 40px; letter-spacing: -.035em; font-weight: 800; line-height: 1.1; }
.page-head p { color: var(--muted); margin-top: 6px; }

/* ---------- Cards ---------- */
.grid { display: grid; gap: 20px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: 2fr 1fr; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 22px; }
.card-head { padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 17px; letter-spacing: -.01em; }
.card-head p { color: var(--muted); font-size: 13px; }
.stat { display: flex; gap: 16px; align-items: center; padding: 22px; }
.ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); color: var(--primary); flex: none; }
.ico.coral { background: var(--accent-soft); color: #e2552f; }
.ico.teal { background: #dcf5f1; color: #0b8a7b; }
.ico.blue { background: #e3ecfd; color: #3b68c9; }
.stat small { color: var(--muted); }
.stat strong { display: block; font-size: 28px; letter-spacing: -.03em; line-height: 1.2; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 600; }
.pill.good { background: #dcf5f1; color: #0b8a7b; }
.pill.warn { background: var(--accent-soft); color: #c2410c; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 22px; background: var(--bg); }
td { padding: 14px 22px; border-top: 1px solid var(--line); font-size: 14px; }
th.r, td.r { text-align: right; }
td.amt { font-weight: 700; }
.row-ico { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
.row-ico .ico { width: 32px; height: 32px; border-radius: 10px; }
.row-ico .ico svg { width: 16px; height: 16px; }
.icon-btn { background: none; border: 0; padding: 6px; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--accent-soft); color: #c2410c; }
.empty { padding: 36px 22px; text-align: center; color: var(--muted); }
.table-wrap { overflow-x: auto; }

.banner { margin-top: 20px; background: linear-gradient(100deg, var(--primary), #6a49c8); color: #fff; border-radius: var(--radius); padding: 22px 26px; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.banner b { font-size: 17px; display: block; }
.banner span { opacity: .85; font-size: 14px; }
.banner .btn { background: #fff; color: var(--primary); }
.hero-card { background: linear-gradient(120deg, #2a1768, var(--primary)); color: #fff; border-radius: 22px; padding: 32px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; box-shadow: var(--shadow); }
.hero-card small { opacity: .8; }
.hero-card strong { display: block; font-size: 52px; letter-spacing: -.04em; line-height: 1.1; margin: 6px 0; }
.hero-card .box { background: rgba(255,255,255,.14); border-radius: 16px; padding: 22px 30px; text-align: center; min-width: 210px; }
.hero-card .box strong { font-size: 26px; }

.donut { position: relative; width: 180px; height: 180px; margin: 0 auto; flex: none; }
.donut svg { width: 100%; height: 100%; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut-c strong { font-size: 28px; letter-spacing: -.03em; line-height: 1.1; }
.donut-c span { font-size: 12px; color: var(--muted); }
.legend { display: grid; gap: 10px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 10px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend em { margin-left: auto; padding-left: 24px; font-style: normal; font-weight: 700; }
.legend small { color: var(--muted); width: 34px; text-align: right; }
.center-col { display: grid; gap: 18px; justify-items: center; padding: 24px; }

.goal { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.goal header { display: flex; gap: 14px; align-items: center; }
.goal h3 { font-size: 17px; }
.goal small { color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c); transition: width .5s ease; }
.goal-actions { display: flex; gap: 8px; margin-top: 4px; }

.seg { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.split { display: flex; align-items: center; gap: 36px; justify-content: center; padding: 28px; flex-wrap: wrap; }
.big-card { padding: 26px; background: var(--accent-soft); border-color: #ffd5c8; box-shadow: none; }
.big-card h2 { font-size: 28px; letter-spacing: -.03em; margin: 8px 0 4px; }
.profile-card { max-width: 760px; }
.who { display: flex; gap: 16px; align-items: center; padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.who small { color: var(--muted); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.two-col { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }

/* ---------- Modal & toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(27,22,51,.45); display: grid; place-items: center; padding: 20px; z-index: 50; animation: fade .15s ease; }
.modal { background: #fff; border-radius: 20px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 30px 60px -20px rgba(27,22,51,.5); }
.modal h2 { font-size: 22px; letter-spacing: -.02em; margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes fade { from { opacity: 0; } }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .auth { grid-template-columns: 1fr; }
  .auth-hero { min-height: 300px; padding: 32px; }
  .g3 { grid-template-columns: 1fr; }
  .g2, .two-col { grid-template-columns: 1fr; }
  .shell { grid-template-columns: 1fr; padding-bottom: 72px; }
  .side { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; padding: 6px; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); z-index: 40; }
  .side .brand, .side-foot { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 8px 6px; }
  .topbar, .page { padding-left: 20px; padding-right: 20px; }
  .page-head h1 { font-size: 32px; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
/* BudgetBuddy – vanilla JS, no build step. Data is saved in the browser (localStorage). */
(() => {
  'use strict';

  /* ---------- Helpers ---------- */
  const KEY = 'budgetbuddy:v2';
  const CATS = ['Food', 'Transportation', 'School Supplies', 'Entertainment', 'Other'];
  const CAT_COLOR = { 'School Supplies': 'var(--c1)', Food: 'var(--c2)', Transportation: 'var(--c3)', Entertainment: 'var(--c4)', Other: 'var(--c5)' };
  const CAT_ICON = { Food: 'receipt', Transportation: 'arrow', 'School Supplies': 'wallet', Entertainment: 'sparkle', Other: 'receipt' };
  const GOAL_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c5)', 'var(--c3)', 'var(--c4)'];

  const ICONS = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    wallet: '<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4"/><circle cx="16.5" cy="13.5" r="1"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    sparkle: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    bars: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  };
  const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const peso = n => '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => toISO(new Date());
  const parse = iso => new Date(iso + 'T00:00:00');
  const fmtDate = iso => parse(iso).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
  const monthName = d => d.toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });
  const uid = () => Math.random().toString(36).slice(2, 10);
  const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || 'BB';
  const $ = (s, el = document) => el.querySelector(s);

  /* ---------- State ---------- */
  function seed() {
    const now = new Date();
    const ago = n => { const d = new Date(); d.setDate(d.getDate() - n); return toISO(d); };
    const firstOf = off => toISO(new Date(now.getFullYear(), now.getMonth() + off, 1));
    return {
      allowances: [
        { id: uid(), date: firstOf(0), amount: 5000, note: 'Monthly allowance' },
        { id: uid(), date: firstOf(-1), amount: 2500, note: 'Monthly allowance' },
        { id: uid(), date: firstOf(-2), amount: 2500, note: 'Monthly allowance' },
      ],
      expenses: [
        { id: uid(), date: ago(0), desc: 'Lunch', cat: 'Food', amount: 120 },
        { id: uid(), date: ago(1), desc: 'Jeepney fare', cat: 'Transportation', amount: 40 },
        { id: uid(), date: ago(2), desc: 'Snacks', cat: 'Food', amount: 60 },
        { id: uid(), date: ago(3), desc: 'Notebook', cat: 'School Supplies', amount: 250 },
        { id: uid(), date: ago(4), desc: 'Printing', cat: 'School Supplies', amount: 80 },
        { id: uid(), date: ago(5), desc: 'Project materials', cat: 'School Supplies', amount: 1800 },
      ],
      goals: [
        { id: uid(), name: 'New laptop', target: 10000, saved: 2000, due: toISO(new Date(now.getFullYear() + 1, 0, 31)) },
        { id: uid(), name: 'School supplies', target: 5000, saved: 2000, due: toISO(new Date(now.getFullYear() + 1, 5, 15)) },
        { id: uid(), name: 'Travel fund', target: 15000, saved: 1500, due: toISO(new Date(now.getFullYear() + 1, 2, 30)) },
      ],
    };
  }
  const empty = () => ({ allowances: [], expenses: [], goals: [] });

  let db = loadDB();
  const state = { session: false, user: null, data: empty(), range: 'monthly', authMode: 'login' };
  function loadDB() {
    const fresh = { users: {}, session: null, locks: {} };
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (!saved || typeof saved !== 'object' || !saved.users || typeof saved.users !== 'object') return fresh;
      saved.locks = saved.locks && typeof saved.locks === 'object' ? saved.locks : {};
      Object.entries(saved.users).forEach(([email, user]) => {
        if (!user || typeof user !== 'object') { delete saved.users[email]; return; }
        user.email = user.email || email;
        user.name = typeof user.name === 'string' && user.name.trim() ? user.name : 'BudgetBuddy User';
        user.data = user.data && typeof user.data === 'object' ? user.data : empty();
        user.data.allowances = Array.isArray(user.data.allowances) ? user.data.allowances : [];
        user.data.expenses = Array.isArray(user.data.expenses) ? user.data.expenses : [];
        user.data.goals = Array.isArray(user.data.goals) ? user.data.goals : [];
      });
      return saved;
    } catch (e) { return fresh; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast('Could not save changes. Check your browser storage settings.'); }
  }
  function startSession(email) {
    const u = db.users[email];
    if (!u) return;
    u.data = u.data && typeof u.data === 'object' ? u.data : empty();

        }); break;
      case 'add-goal':
        openModal('Add goal', field('Goal name', 'name', 'required maxlength="40" placeholder="e.g. New phone"') + field('Target amount', 'target', 'type="number" min="1" step="0.01" required') + field('Already saved', 'saved', 'type="number" min="0" step="0.01" value="0"') + field('Target date', 'due', `type="date" required value="${toISO(new Date(new Date().getFullYear() + 1, 0, 1))}"`), v => {
          state.data.goals.push({ id: uid(), name: v.name, target: Number(v.target), saved: Math.min(Number(v.saved || 0), Number(v.target)), due: v.due }); save(); render(); toast('Goal added');
        }, 'Add goal'); break;
    }
  });

  async function handleAuth(f) {
    const v = Object.fromEntries(new FormData(f)), err = $('#auth-error'), reg = f.dataset.mode === 'register';
    const btn = $('#auth-submit'), label = btn.querySelector('span');
    const email = (v.email || '').trim().toLowerCase(), pw = v.password || '';
    f.querySelectorAll('.control.bad').forEach(c => c.classList.remove('bad'));
    err.textContent = '';
    const fail = (m, name) => {
      err.textContent = m; btn.disabled = false; label.textContent = btn.dataset.label;
      const el = name && f.querySelector(`[name=${name}]`); if (el) { el.closest('.control').classList.add('bad'); el.focus(); }
    };
    if (reg && !(v.name || '').trim()) return fail('Enter your full name.', 'name');
    if (!email) return fail('Enter your email address.', 'email');
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail('That email looks incomplete. Try something like juan@example.com.', 'email');
    if (!pw) return fail('Enter your password.', 'password');
    btn.disabled = true; label.textContent = reg ? 'Creating account…' : 'Logging in…';
    if (reg) {
      if (!strongPw(pw)) return fail('Your password needs at least 8 characters, with a letter and a number.', 'password');
      if (pw !== v.confirm) return fail('The two passwords do not match.', 'confirm');
      if (db.users[email]) return fail('That email already has an account. Tap Log in instead.', 'email');
      const salt = newSalt();
      db.users[email] = { name: v.name.trim(), email, goal: 0, since: new Date().toLocaleDateString('en-PH', { month: 'long', year: 'numeric' }), salt, hash: await hashPw(pw, salt), data: empty() };
      startSession(email); state.authEmail = '';
      toast('Account created. Welcome, ' + v.name.trim().split(' ')[0] + '!');
    } else {
      db.locks = db.locks || {};
      const lock = db.locks[email];
      if (lock && lock.until > Date.now()) return fail(`Too many tries. Wait ${Math.ceil((lock.until - Date.now()) / 1000)} seconds and try again.`);
      const u = db.users[email];
      if (!u) return fail('No account found for that email on this device. Tap Register to create one.', 'email');
      if ((await hashPw(pw, u.salt)) !== u.hash) {
        const l = db.locks[email] = db.locks[email] || { n: 0, until: 0 };
        l.n++; const left = 5 - l.n;
        if (l.n >= 5) { l.until = Date.now() + 30000; l.n = 0; }
        save(); return fail(left > 0 ? `Wrong password. ${left} ${left === 1 ? 'try' : 'tries'} left.` : 'Too many wrong tries. Wait 30 seconds.', 'password');
      }
      delete db.locks[email];
      startSession(email); state.authEmail = '';
      toast('Welcome back, ' + u.name.split(' ')[0] + '!');
    }
    location.hash = '#/dashboard'; render();
  }
  async function changePassword(f) {
    const v = Object.fromEntries(new FormData(f)), err = $('#pw-error'), u = state.user;
    if ((await hashPw(v.current, u.salt)) !== u.hash) { err.textContent = 'Your current password is incorrect.'; return; }
    if (!strongPw(v.next)) { err.textContent = 'Use at least 8 characters with a letter and a number.'; return; }
    u.salt = newSalt(); u.hash = await hashPw(v.next, u.salt); save(); f.reset(); err.textContent = ''; toast('Password updated');
  }
  document.addEventListener('input', e => {
    if (!e.target.matches('#auth-form[data-mode=register] input[name=password]')) return;
    const pw = e.target.value, ok = { len: pw.length >= 8, let: /[A-Za-z]/.test(pw), num: /\d/.test(pw) };
    document.querySelectorAll('#pw-hint span').forEach(s => s.classList.toggle('ok', ok[s.dataset.r]));
  });
  document.addEventListener('change', e => {
    if (e.target.matches('[data-showpw]')) e.target.closest('form').querySelectorAll('input[name=password],input[name=confirm]').forEach(i => { i.type = e.target.checked ? 'text' : 'password'; });
  });

  document.addEventListener('submit', e => {
    const f = e.target;
    if (f.id === 'auth-form') {
      e.preventDefault();
      handleAuth(f).catch(err => {
        const message = $('#auth-error');
        const button = $('#auth-submit');
        if (message) message.textContent = 'Something went wrong while signing in. Please try again.';
        if (button) { button.disabled = false; const label = button.querySelector('span'); if (label) label.textContent = button.dataset.label; }
        console.error('BudgetBuddy authentication error:', err);
      });
      return;
    }
    if (f.id === 'pw-form') {
      e.preventDefault();
      changePassword(f).catch(err => {
        const message = $('#pw-error');
        if (message) message.textContent = 'Could not update the password. Please try again.';
        console.error('BudgetBuddy password update error:', err);
      });
      return;
    }
    if (f.id === 'expense-form') {
      e.preventDefault(); const v = Object.fromEntries(new FormData(f));
      state.data.expenses.push({ id: uid(), date: v.date, desc: v.desc.trim(), cat: v.cat, amount: Number(v.amount) });
      save(); render(); toast('Expense saved'); return;
    }
    if (f.id === 'profile-form') {
      e.preventDefault(); const v = Object.fromEntries(new FormData(f));
      Object.assign(state.user, { name: v.name.trim(), goal: Number(v.goal || 0) }); save(); render(); toast('Profile saved');
    }
  });

  render();
})();

</script>
</body>
</html>
